<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Warframe Weeklies Checklist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@400;600&family=Orbitron:wght@400;700&family=Pacifico&family=Press+Start+2P&family=Rajdhani:wght@400;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bg" aria-hidden="true"><i></i><i></i><i></i></div>
  <main id="main">
    <header class="page-head">
      <div class="title-group">
        <h1>Weeklies</h1>
        <span id="resetTimer" class="reset-timer" tabindex="0">Weekly reset in: <time id="resetCountdown">--</time></span>
      </div>
      <span id="progress" aria-live="polite"></span>
    </header>
    <div class="bar" aria-hidden="true"><span id="progressBar"></span></div>

    <div id="taskList"></div>

    <div class="actions">
      <button id="editBtn" type="button" aria-expanded="false" aria-controls="editMenu">Toggle Edit Menu</button>
      <button id="resetBtn" type="button">Reset All</button>
    </div>

    <section id="editMenu" aria-label="Theme settings">
      <div class="menu-head">
        <h3>Edit Theme</h3>
        <button id="resetThemeBtn" type="button">Reset Theme</button>
      </div>
      <div class="theme-grid">
        <div class="color-picker"><label for="bgPicker">Page Background</label><input type="color" id="bgPicker"></div>
        <div class="color-picker"><label for="textPicker">Text</label><input type="color" id="textPicker"></div>
        <div class="color-picker"><label for="btnOffPicker">Uncompleted</label><input type="color" id="btnOffPicker"></div>
        <div class="color-picker"><label for="btnOnPicker">Completed</label><input type="color" id="btnOnPicker"></div>
        <div class="color-picker"><label for="editBtnPicker">Edit Button</label><input type="color" id="editBtnPicker"></div>
        <div class="color-picker"><label for="resetBtnPicker">Reset Button</label><input type="color" id="resetBtnPicker"></div>
        <div class="color-picker"><label for="editMenuBgPicker">Edit Menu Background</label><input type="color" id="editMenuBgPicker"></div>
        <div class="color-picker"><label for="fontPicker">Font</label><select id="fontPicker"></select></div>
        <div class="color-picker wide">
          <label for="textSizePicker">Text Size</label>
          <div class="range-wrap">
            <input type="range" id="textSizePicker" min="8" max="48" value="16">
            <span id="textSizeValue">16 px</span>
          </div>
        </div>
      </div>
    </section>
  </main>

    <script>
    // ---------- state ----------
    let rows = [];            // array of arrays of task objects
    let state = [];           // completed flag per task (flat index)
    let visibility = [];      // per-task visibility (flat index)
    let rowVisibility = [];   // per-row visibility
    let firstRender = true;   // entrance animation plays once
    let justDone = -1;        // task just completed by a click
    let openInfo = -1;        // task whose info popover is open (flat index)
    let refocus = -1;         // info button to re-focus after a re-render
    let weekData = { date: null, entries: {} };   // loaded from weekly.json

    const $ = id => document.getElementById(id);
    const taskList = $('taskList');
    const editMenu = $('editMenu');
    const editBtn = $('editBtn');
    const resetBtn = $('resetBtn');
    const fontPicker = $('fontPicker');
    const textSizePicker = $('textSizePicker');
    const textSizeValue = $('textSizeValue');

    // turns "[text](https://url)" and bare http(s) URLs into links; everything else stays plain text.
    // Built with DOM nodes (no innerHTML) and limited to http/https, so tasks.json can't inject scripts.
    function appendLinked(el, text) {
      const re = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<]*[^\s<.,;:!?)\]])/g;
      let last = 0, m;
      while ((m = re.exec(text))) {
        if (m.index > last) el.appendChild(document.createTextNode(text.slice(last, m.index)));
        const a = document.createElement('a');
        a.href = m[2] || m[3];
        a.textContent = m[1] || m[3];
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        el.appendChild(a);
        last = re.lastIndex;
      }
      if (last < text.length) el.appendChild(document.createTextNode(text.slice(last)));
    }

    const readJSON = (key, fallback) => {
      try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
      catch { return fallback; }
    };

    const save = () => {
      localStorage.setItem('state', JSON.stringify(state));
      localStorage.setItem('visibility', JSON.stringify(visibility));
      localStorage.setItem('rowVisibility', JSON.stringify(rowVisibility));
    };

    // ---------- theme ----------
    const presetFonts = [
      "system-ui", "Arial", "Verdana", "Tahoma", "Georgia", "Courier New", "Times New Roman",
      // fun ones (loaded from Google Fonts in <head>)
      "Orbitron", "Rajdhani", "Press Start 2P", "Bangers", "Fredoka", "Pacifico"
    ];

    const defaultTheme = {
      '--bg': '#0f1419',
      '--fg': '#e7ecf2',
      '--btn-bg': '#18212b',
      '--btn-active': '#2b7a68',
      '--edit-btn': '#243040',
      '--reset-btn': '#4a2a30',
      '--edit-menu-bg': '#151d26',
      '--btn-text-size': '16',
      '--font-family': 'system-ui'
    };

    // picker element id -> CSS variable (same localStorage keys as before, so saved themes carry over)
    const colorInputs = {
      bgPicker: '--bg',
      textPicker: '--fg',
      btnOffPicker: '--btn-bg',
      btnOnPicker: '--btn-active',
      editBtnPicker: '--edit-btn',
      resetBtnPicker: '--reset-btn',
      editMenuBgPicker: '--edit-menu-bg'
    };

    const root = document.documentElement;
    const savedTheme = v => localStorage.getItem(v) || defaultTheme[v];

    presetFonts.forEach(f => {
      const option = document.createElement('option');
      option.value = f;
      option.textContent = f === 'system-ui' ? 'System UI' : f;
      option.style.fontFamily = f;   // preview each font in the list
      fontPicker.appendChild(option);
    });

    Object.entries(colorInputs).forEach(([id, varName]) => {
      const el = $(id);
      const value = savedTheme(varName);
      el.value = value;
      root.style.setProperty(varName, value);
      el.addEventListener('input', e => {
        root.style.setProperty(varName, e.target.value);
        localStorage.setItem(varName, e.target.value);
      });
    });

    (() => {
      const size = savedTheme('--btn-text-size');
      textSizePicker.value = size;
      textSizeValue.textContent = size + ' px';
      root.style.setProperty('--btn-text-size', size + 'px');
    })();
    textSizePicker.addEventListener('input', e => {
      const val = e.target.value;
      root.style.setProperty('--btn-text-size', val + 'px');
      textSizeValue.textContent = val + ' px';
      localStorage.setItem('--btn-text-size', val);
    });

    (() => {
      const font = savedTheme('--font-family');
      if (![...fontPicker.options].some(o => o.value === font)) {
        const option = document.createElement('option');
        option.value = option.textContent = font;
        fontPicker.appendChild(option);
      }
      fontPicker.value = font;
      root.style.setProperty('--font-family', font);
    })();
    fontPicker.addEventListener('change', e => {
      root.style.setProperty('--font-family', e.target.value);
      localStorage.setItem('--font-family', e.target.value);
    });

    // back to the default look; only touches theme settings, not your progress
    $('resetThemeBtn').onclick = () => {
      Object.entries(colorInputs).forEach(([id, varName]) => {
        localStorage.removeItem(varName);
        $(id).value = defaultTheme[varName];
        root.style.setProperty(varName, defaultTheme[varName]);
      });
      const size = defaultTheme['--btn-text-size'];
      localStorage.removeItem('--btn-text-size');
      textSizePicker.value = size;
      textSizeValue.textContent = size + ' px';
      root.style.setProperty('--btn-text-size', size + 'px');
      localStorage.removeItem('--font-family');
      fontPicker.value = defaultTheme['--font-family'];
      root.style.setProperty('--font-family', defaultTheme['--font-family']);
    };

    // ---------- weekly reset ----------
    // Warframe's weekly reset is Monday 00:00 UTC. Change these two values to move it.
    const RESET_DAY_UTC = 1;    // 0 = Sunday, 1 = Monday ... 6 = Saturday
    const RESET_HOUR_UTC = 0;   // 0-23
    const WEEK = 7 * 864e5;

    // most recent reset moment (ms since epoch)
    function lastResetTime(now = Date.now()) {
      const d = new Date(now);
      const back = (d.getUTCDay() - RESET_DAY_UTC + 7) % 7;
      let t = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - back, RESET_HOUR_UTC);
      if (t > now) t -= WEEK;
      return t;
    }

    // clears completed tasks if a reset moment has passed since we last looked
    function applyWeeklyReset() {
      const boundary = lastResetTime();
      const seen = Number(localStorage.getItem('lastReset'));
      localStorage.setItem('lastReset', String(boundary));
      if (seen && seen < boundary) {
        state = state.map(() => false);
        save();
        return true;
      }
      return false;
    }

    let nextReset = 0;

    function updateResetInfo() {
      const next = lastResetTime() + WEEK;
      const ms = Math.max(0, next - Date.now());
      const d = Math.floor(ms / 864e5);
      const p = n => String(n).padStart(2, '0');
      const hms = `${p(Math.floor(ms % 864e5 / 36e5))}:${p(Math.floor(ms % 36e5 / 6e4))}:${p(Math.floor(ms % 6e4 / 1e3))}`;
      $('resetCountdown').textContent = d ? `${d}d ${hms}` : hms;
      // shown by a CSS tooltip (data-tip); only rewritten when it changes
      const label = 'Resets ' + new Date(next).toLocaleString([], { weekday: 'long', hour: '2-digit', minute: '2-digit' });
      if ($('resetTimer').dataset.tip !== label) $('resetTimer').dataset.tip = label;
    }

    // runs every second: refresh the countdown, and clear tasks the moment a reset passes
    function tick() {
      if (Date.now() >= nextReset) {
        nextReset = lastResetTime() + WEEK;
        if (rows.length && applyWeeklyReset()) renderTasks();
      }
      updateResetInfo();
    }
    setInterval(tick, 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
    updateResetInfo();

    // ---------- weekly info boxes ----------
    // weekly.json: { "date": "YYYY-MM-DD", "entries": { "<task label>": { date?, title, text, image } } }
    // An entry only counts if its date (or the top-level date) falls inside the current week.
    function weekInfo(label) {
      const entry = weekData.entries[label] || null;
      const date = entry?.date || weekData.date;
      const t = Date.parse(date);               // "YYYY-MM-DD" is read as UTC
      const start = lastResetTime();
      const fresh = !!entry && t >= start && t < start + WEEK;
      return { fresh, entry, date };
    }

    function buildWeekBox(label, alignEnd) {
      const { fresh, entry, date } = weekInfo(label);

      const box = document.createElement('div');
      box.className = 'week-box' + (fresh ? '' : ' unknown');
      box.tabIndex = 0;   // keyboard focus / tap on touch screens also opens it
      box.setAttribute('aria-label', 'This week: ' + label);

      const txt = document.createElement('span');
      txt.className = 'label';
      txt.textContent = fresh ? (entry.title || 'This week') : 'Unknown';
      box.appendChild(txt);

      const pop = document.createElement('div');
      pop.className = 'week-pop' + (alignEnd ? ' end' : '');
      pop.setAttribute('role', 'tooltip');

      const head = document.createElement('strong');
      head.textContent = label;
      pop.appendChild(head);

      if (fresh) {
        if (entry.image) {
          const img = document.createElement('img');
          img.src = entry.image;
          img.alt = entry.title || label;
          img.loading = 'lazy';
          img.onerror = () => img.remove();
          pop.appendChild(img);
        }
        const body = Array.isArray(entry.text) ? entry.text.join('\n') : entry.text;
        if (body) {
          const p = document.createElement('div');
          appendLinked(p, body);
          pop.appendChild(p);
        }
      } else {
        const p = document.createElement('div');
        p.textContent = 'Not updated yet.';
        pop.appendChild(p);
      }

      if (date && entry) {
        const small = document.createElement('small');
        small.textContent = (fresh ? 'Week of ' : 'Last data: ') + date;
        pop.appendChild(small);
      }

      box.appendChild(pop);
      return box;
    }

    // ---------- tasks ----------
    async function loadTasks() {
      try {
        const res = await fetch('tasks.json');
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();

        // arrays become multi-item rows, single objects become one-item rows
        rows = (data.tasks || []).map(t => Array.isArray(t) ? t : [t]);
      } catch (err) {
        taskList.innerHTML = '<p class="error">Couldn\'t load tasks.json. Check that the file exists and is valid JSON.</p>';
        console.error(err);
        return;
      }

      try {
        const res = await fetch('weekly.json', { cache: 'no-cache' });
        if (res.ok) {
          const d = await res.json();
          weekData = { date: d.date || null, entries: d.entries || {} };
        }
      } catch (err) { console.warn('weekly.json not loaded', err); }

      const flat = rows.flat();
      const savedState = readJSON('state', []);
      const savedVis = readJSON('visibility', []);
      state = flat.map((_, i) => i < savedState.length ? !!savedState[i] : false);
      visibility = flat.map((_, i) => i < savedVis.length ? !!savedVis[i] : true);

      const savedRowVis = readJSON('rowVisibility', null);
      if (Array.isArray(savedRowVis)) {
        rowVisibility = rows.map((_, i) => i < savedRowVis.length ? !!savedRowVis[i] : true);
      } else {
        // derive from per-item visibility when no row-level data was stored
        let idx = 0;
        rowVisibility = rows.map(r => r.some(() => visibility[idx++] ?? true));
      }

      applyWeeklyReset();
      save();
      renderTasks();
      updateResetInfo();
    }

    function renderTasks() {
      taskList.innerHTML = '';
      const editOpen = editMenu.classList.contains('open');
      taskList.classList.toggle('editing', editOpen);
      let toFocus = null;
      let counter = 0;
      let total = 0;
      let done = 0;

      rows.forEach((rowTasks, rowIndex) => {
        const rowStart = counter;
        const row = document.createElement('div');
        row.className = 'task-row';
        if (firstRender) { row.classList.add('enter'); row.style.setProperty('--i', rowIndex); }
        let visibleInRow = 0;
        let pop = null;

        rowTasks.forEach((t, ti) => {
          const i = counter++;
          const item = document.createElement('div');
          item.className = 'task-item';

          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'toggle' + (state[i] ? ' active' : '') + (i === justDone ? ' pop' : '');
          btn.setAttribute('aria-pressed', state[i] ? 'true' : 'false');
          const label = document.createElement('span');
          label.className = 'label';
          label.textContent = t.label || t.name || 'Task';
          btn.appendChild(label);
          btn.onclick = () => {
            openInfo = -1;
            state[i] = !state[i];
            justDone = state[i] ? i : -1;
            save();
            renderTasks();
          };

          const shown = visibility[i] && rowVisibility[rowIndex];
          if (shown) {
            visibleInRow++;
            total++;
            if (state[i]) done++;
          } else if (editOpen) {
            btn.classList.add('dimmed');   // still reachable while editing
          } else {
            item.style.display = 'none';
          }

          const wrap = document.createElement('div');   // keeps the "i" button anchored to the task button
          wrap.className = 'toggle-wrap';
          wrap.appendChild(btn);
          item.appendChild(wrap);

          // optional "i" button: shows the task's "info" text from tasks.json
          const infoText = Array.isArray(t.info) ? t.info.join('\n') : t.info;
          if (infoText) {
            btn.classList.add('has-info');
            const label = t.label || t.name || 'task';
            const ib = document.createElement('button');
            ib.type = 'button';
            ib.className = 'info-btn';
            ib.textContent = 'i';
            ib.setAttribute('aria-label', 'About ' + label);
            ib.setAttribute('aria-expanded', String(i === openInfo));
            ib.onclick = e => {
              e.stopPropagation();
              openInfo = openInfo === i ? -1 : i;
              refocus = i;
              renderTasks();
            };
            wrap.appendChild(ib);
            if (i === refocus) toFocus = ib;
            if (i === openInfo && (shown || editOpen)) {
              pop = document.createElement('div');
              pop.className = 'info-pop';
              pop.setAttribute('role', 'note');
              const head = document.createElement('strong');
              head.textContent = label;
              pop.appendChild(head);
              appendLinked(pop, infoText);
            }
          }

          item.appendChild(buildWeekBox(t.label || t.name || 'Task', ti === rowTasks.length - 1));
          row.appendChild(item);
        });

        if (pop) { row.classList.add('info-open'); row.appendChild(pop); }

        // row-level Hide/Show (only shown while the edit menu is open)
        const rowCtrl = document.createElement('div');
        rowCtrl.className = 'row-control';
        const rowBtn = document.createElement('button');
        rowBtn.type = 'button';
        rowBtn.textContent = rowVisibility[rowIndex] ? 'Hide' : 'Show';
        rowBtn.dataset.hidden = String(!rowVisibility[rowIndex]);
        rowCtrl.style.display = editOpen ? 'flex' : 'none';
        rowBtn.onclick = () => {
          rowVisibility[rowIndex] = !rowVisibility[rowIndex];
          for (let j = 0; j < rowTasks.length; j++) visibility[rowStart + j] = rowVisibility[rowIndex];
          save();
          renderTasks();
        };
        rowCtrl.appendChild(rowBtn);
        row.appendChild(rowCtrl);

        // equal-width columns: one per visible button
        row.style.setProperty('--cols', Math.max(1, editOpen ? rowTasks.length : visibleInRow));

        if (!editOpen && (visibleInRow === 0 || !rowVisibility[rowIndex])) row.style.display = 'none';

        taskList.appendChild(row);
      });

      $('progress').textContent = total > 0 && done === total ? 'All done!' : `${done} / ${total} done`;
      $('progressBar').style.width = total ? `${(done / total) * 100}%` : '0';
      justDone = -1;
      firstRender = false;
      refocus = -1;
      if (toFocus) toFocus.focus();
    }

    editBtn.onclick = () => {
      const open = editMenu.classList.toggle('open');
      editBtn.setAttribute('aria-expanded', String(open));
      renderTasks();
    };

    resetBtn.onclick = () => {
      state = state.map(() => false);
      save();
      renderTasks();
    };

    // click anywhere else (or press Escape) to close an open info popover
    document.addEventListener('click', e => {
      if (openInfo === -1 || e.target.closest('.info-btn, .info-pop')) return;
      openInfo = -1;
      renderTasks();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && openInfo !== -1) { openInfo = -1; renderTasks(); }
    });

    loadTasks();
  </script>
</body>
</html>
